# Backend only. The existing Cloudflare Worker/static-assets deployment is unchanged.
services:
  - type: web
    name: traceintel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/ready
    preDeployCommand: alembic upgrade head
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TRACEINTEL_ENVIRONMENT
        value: production
      - key: TRACEINTEL_SKIP_MIGRATIONS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: TRACEINTEL_PROXY_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
      - key: TRACEINTEL_CORS_ORIGINS
        value: '["https://traceintel.eshita.dev"]'
      - key: TRACEINTEL_MAX_CONCURRENT_ANALYSES
        value: "2"
      - key: TRACEINTEL_DAILY_ANALYSES
        value: "100"
      - key: TRACEINTEL_DAILY_LLM_ANALYSES
        value: "20"
      - key: TRACEINTEL_REQUESTS_PER_HOUR
        value: "20"
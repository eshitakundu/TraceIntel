[project]
name = "traceintel"
version = "0.1.0"
description = "Evidence-first EVM transaction intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "nooa>=0.0.10",
  "sqlalchemy>=2.0.54",
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "alembic>=1.20.0",
  "eth-abi>=6.0.0",
  "eth-utils>=6.0.0",
  "eth-hash[pycryptodome]>=0.8.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend/typings", "backend"]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["app.agents.transaction_analyst", "app.agents.contract_analyst", "app.agents.report_synthesizer"]
disable_error_code = ["empty-body"]